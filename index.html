<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>カメラ窓ブラウザ</title>
<style>
  :root{--bar:#1d2430;--fg:#f2f4f7;--accent:#4aa3ff;--line:#3a4556}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif}
  #web{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#667;font-size:15px;padding:24px;text-align:center;line-height:1.7}
  #cam{position:fixed;z-index:5;pointer-events:none;background:#000;border:2px solid var(--accent);
    border-radius:10px;overflow:hidden}
  #cam video{width:100%;height:100%;object-fit:cover;display:block}
  #bar{position:fixed;z-index:10;left:0;right:0;bottom:0;background:var(--bar);color:var(--fg);
    padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));
    display:flex;flex-direction:column;gap:8px;font-size:14px}
  #bar.closed{display:none}
  #show{position:fixed;z-index:10;right:max(10px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));
    width:44px;height:44px;border-radius:22px;background:rgba(29,36,48,.85);font-size:18px;padding:0}
  .row{display:flex;gap:8px;align-items:center}
  input[type=url]{flex:1;min-width:0;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--line);
    background:#0f141c;color:var(--fg)}
  input[type=range]{flex:1}
  button,select{font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:#2b3546;color:var(--fg)}
  button.main{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:700}
  #val{width:3.5em;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  #msg{color:#ffb4a8;font-size:13px}
  #rec.on{background:#e5484d;border-color:#e5484d;color:#fff;font-weight:700}
  #rec:disabled{opacity:.45}
  #time{font-variant-numeric:tabular-nums;min-width:3em}
  #cam.recording{border-color:#e5484d;border-width:3px}
</style>
</head>
<body>
<div id="empty">下の欄にURLを入れて「開く」を押してください。<br>表示されないサイトは、埋め込みを禁止しています。</div>
<iframe id="web" hidden allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
<div id="cam" hidden><video id="video" playsinline muted autoplay></video></div>

<div id="bar">
  <div class="row">
    <input id="url" type="url" placeholder="https://..." value="https://www.tiktok.com/@ham_ai_skill/video/7691276969912241416">
    <button id="go">開く</button>
    <button id="toggle" aria-label="操作欄をしまう">▼</button>
  </div>
  <div class="row more">
    <span>透明度</span>
    <input id="op" type="range" min="0" max="100" value="100">
    <span id="val">100%</span>
  </div>
  <div class="row more">
    <button id="start" class="main">カメラ起動</button>
    <select id="facing" aria-label="カメラの向き">
      <option value="environment">背面</option>
      <option value="user">前面</option>
    </select>
    <select id="size" aria-label="窓の大きさ">
      <option value="4">1/4</option>
      <option value="6">1/6</option>
      <option value="8">1/8</option>
    </select>
    <select id="pos" aria-label="窓の位置">
      <option value="tr">右上</option>
      <option value="tl">左上</option>
      <option value="br">右下</option>
      <option value="bl">左下</option>
    </select>
  </div>
  <div class="row more">
    <button id="rec" disabled>● 録画開始</button>
    <span id="time">0:00</span>
    <label><input id="withAudio" type="checkbox"> 音声も録る</label>
    <button id="save" class="main" hidden>保存</button>
  </div>
  <div id="msg" class="more"></div>
</div>
<button id="show" hidden aria-label="操作欄を出す">▲</button>

<script>
const $ = id => document.getElementById(id);
const cam = $('cam'), video = $('video'), bar = $('bar');
let stream = null;

// 透明度
function setOpacity(){ cam.style.opacity = $('op').value/100; $('val').textContent = $('op').value + '%'; }
$('op').addEventListener('input', setOpacity);

// 窓の大きさと位置（画面の面積の 1/n）
function layout(){
  const n = +$('size').value, W = innerWidth, H = innerHeight;
  const s = Math.sqrt(1/n);            // 面積が1/nになる縦横の比率
  const w = Math.round(W*s), h = Math.round(H*s);
  cam.style.width = w+'px'; cam.style.height = h+'px';
  const m = 8, p = $('pos').value, barH = bar.offsetHeight;
  cam.style.top = cam.style.bottom = cam.style.left = cam.style.right = '';
  if (p[0]==='t') cam.style.top = `calc(${m}px + env(safe-area-inset-top))`;
  else cam.style.bottom = (barH + m) + 'px';
  if (p[1]==='l') cam.style.left = m+'px'; else cam.style.right = m+'px';
}
['size','pos'].forEach(id => $(id).addEventListener('change', layout));
addEventListener('resize', layout);

// カメラ
async function startCam(){
  $('msg').textContent = '';
  if (!navigator.mediaDevices?.getUserMedia){
    $('msg').textContent = 'このページは https で開く必要があります（カメラが使えません）。'; return;
  }
  try{
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:$('facing').value}, audio:false});
    video.srcObject = stream; await video.play();
    cam.hidden = false; $('start').textContent = 'カメラ停止'; $('rec').disabled = false; layout(); setOpacity();
  }catch(e){
    $('msg').textContent = 'カメラを起動できません：' + (e.name==='NotAllowedError' ? 'カメラの使用が許可されていません。' : e.message);
  }
}
function stopCam(){
  if (recorder && recorder.state === 'recording') recorder.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; cam.hidden = true; $('start').textContent = 'カメラ起動'; $('rec').disabled = true;
}

// 録画（カメラ映像だけを録る。透明度は録画に影響しない）
let recorder = null, chunks = [], micStream = null, timer = null, lastFile = null;
function pickType(){
  const list = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  return list.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}
async function startRec(){
  $('msg').textContent = '';
  if (!window.MediaRecorder){ $('msg').textContent = 'このブラウザは録画に対応していません。'; return; }
  const tracks = [...stream.getVideoTracks()];
  if ($('withAudio').checked){
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:true});
      tracks.push(...micStream.getAudioTracks());
    }catch(e){ $('msg').textContent = 'マイクが使えないため、音声なしで録画します。'; }
  }
  const type = pickType();
  recorder = new MediaRecorder(new MediaStream(tracks), type ? {mimeType:type} : undefined);
  chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = finishRec;
  recorder.start(1000);
  const t0 = Date.now();
  timer = setInterval(() => {
    const s = Math.floor((Date.now()-t0)/1000);
    $('time').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }, 500);
  $('rec').textContent = '■ 録画停止'; $('rec').classList.add('on'); cam.classList.add('recording');
  $('save').hidden = true; $('withAudio').disabled = true;
}
function finishRec(){
  clearInterval(timer);
  if (micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  const type = (recorder.mimeType || 'video/mp4').split(';')[0];
  const ext = type.includes('webm') ? 'webm' : 'mp4';
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const name = `camera_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
  lastFile = new File(chunks, name, {type});
  $('rec').textContent = '● 録画開始'; $('rec').classList.remove('on'); cam.classList.remove('recording');
  $('save').hidden = false; $('withAudio').disabled = false;
  $('msg').textContent = `録画しました（${(lastFile.size/1024/1024).toFixed(1)}MB）。「保存」を押してください。`;
}
$('rec').addEventListener('click', () => {
  if (recorder && recorder.state === 'recording') recorder.stop(); else startRec();
});

// 保存：iPhoneは共有シート（「ビデオを保存」で写真アプリへ）、それ以外はダウンロード
$('save').addEventListener('click', async () => {
  if (!lastFile) return;
  if (navigator.canShare && navigator.canShare({files:[lastFile]})){
    try{ await navigator.share({files:[lastFile]}); return; }
    catch(e){ if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(lastFile); a.download = lastFile.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
});
$('start').addEventListener('click', () => stream ? stopCam() : startCam());
$('facing').addEventListener('change', () => { if (stream) startCam(); });

// Webページ
function openUrl(){
  let u = $('url').value.trim(); if (!u) return;
  $('msg').textContent = '';
  if (!/^https?:\/\//.test(u)) u = 'https://' + u;
  // Googleは通常は埋め込み禁止。igu=1 を付けると埋め込み表示できる
  try{
    const x = new URL(u);
    if (/^(www\.)?google\.(com|co\.jp)$/.test(x.hostname)){
      if (x.pathname === '/' ) x.pathname = '/webhp';
      x.searchParams.set('igu','1'); u = x.href;
    }
    // YouTube：動画のURLを埋め込み用アドレスに変える（playsinline=1 で全画面にならずページ内で再生）
    if (/(^|\.)(youtube\.com|youtu\.be)$/.test(x.hostname)){
      let id = null;
      if (x.hostname.endsWith('youtu.be')) id = x.pathname.slice(1).split('/')[0];
      else if (x.searchParams.get('v')) id = x.searchParams.get('v');
      else { const m = x.pathname.match(/\/(?:shorts|embed|live)\/([\w-]{6,})/); if (m) id = m[1]; }
      if (id) u = 'https://www.youtube.com/embed/' + id + '?playsinline=1';
      else $('msg').textContent = 'YouTubeは動画1本ずつ表示できます。動画のURL（watch?v=… や youtu.be/… や shorts/…）を貼ってください。';
    }
    // TikTok：動画のURLを埋め込み用アドレスに変える（トップ画面は埋め込み禁止）
    if (/(^|\.)tiktok\.com$/.test(x.hostname)){
      const m = x.pathname.match(/\/video\/(\d+)/) || x.pathname.match(/\/embed\/(?:v2\/)?(\d+)/);
      const who = x.pathname.match(/^\/(?:embed\/)?(@[\w.\-]+)\/?$/);
      if (m) u = 'https://www.tiktok.com/embed/v2/' + m[1];
      else if (who) u = 'https://www.tiktok.com/embed/' + who[1];   // その人の動画一覧
      else if (/^(vm|vt)\./.test(x.hostname))
        $('msg').textContent = 'TikTokの短いURL（vm.tiktok.com）は開けません。TikTokアプリで動画を開き、ブラウザで表示したときの長いURL（/video/番号 を含むもの）を貼ってください。';
      else
        $('msg').textContent = 'TikTokは「動画のURL（/video/番号）」か「その人のページのURL（/@ユーザー名）」を貼ってください。';
    }
  }catch(e){}
  $('web').src = u; $('web').hidden = false; $('empty').hidden = true;
  try{ localStorage.setItem('lastUrl', u); }catch(e){}
}
$('go').addEventListener('click', openUrl);
$('url').addEventListener('keydown', e => { if (e.key==='Enter') openUrl(); });
// 操作欄をしまう／出す
function setBar(open){
  bar.classList.toggle('closed', !open); $('show').hidden = open; layout();
}
$('toggle').addEventListener('click', () => setBar(false));
$('show').addEventListener('click', () => setBar(true));
layout(); setOpacity();
openUrl();   // 最初はTikTokの動画を表示
</script>
</body>
</html>
